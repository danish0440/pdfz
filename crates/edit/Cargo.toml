[package]
name = "pdfz-edit"
description = "Page content editing: headers and footers, watermarks, backgrounds, Bates numbers (ISO 32000-2 §14.8)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfz-annot = { workspace = true }
pdfz-cos = { workspace = true }
pdfz-content = { workspace = true }
pdfz-fonts = { workspace = true }
pdfz-model = { workspace = true }
thiserror = { workspace = true }
# A backdrop copy's tag records a hash of the operators before the fill it turned off (backdrop.rs).
sha2 = "0.11"
kurbo = { workspace = true }
# Display order of right-to-left lines in added text, and reading and writing order in Edit text;
# already in the tree via the interface.
unicode-bidi = "0.3"

[dev-dependencies]
hayro-syntax = { workspace = true }
