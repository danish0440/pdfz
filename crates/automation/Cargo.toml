[package]
name = "pdfz-automation"
description = "Agent control for PdfZ: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfz-engine = { workspace = true }
pdfz-cos = { workspace = true }
pdfz-render = { workspace = true }
pdfz-organize = { workspace = true }
pdfz-platform = { workspace = true }
craft-prc = { workspace = true }
pdfz-prc-render = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
base64 = { version = "0.23", optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
# Synthetic printer profiles for the app-managed print colour tests.
craft-cms = { workspace = true }
craft-image-codecs = { workspace = true }
# Word exports read back as Word reads them.
craft-docx = { workspace = true }
craft-wordmodel = { workspace = true }
pdfz-fonts = { workspace = true }
flate2.workspace = true
pdfz-model = { workspace = true }
pdfz-xfa = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
