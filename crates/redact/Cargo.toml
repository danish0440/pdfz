[package]
name = "pdfz-redact"
description = "Redaction (architecture §11.2): marks, apply (glyphs, images, vectors, XObjects, annotations, fields), verification"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aho-corasick = "1"
pdfz-cos = { workspace = true }
pdfz-content = { workspace = true }
pdfz-fonts = { workspace = true }
# The usable-quad rule `/QuadPoints` readers share.
pdfz-geom = { workspace = true }
pdfz-model = { workspace = true }
pdfz-forms = { workspace = true }
pdfz-edit = { workspace = true }
pdfz-annot = { workspace = true }
pdfz-xfa = { workspace = true }
# CCITT Group 4 and JBIG2 encoding for cleared one-bit images.
pdfz-filters = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
# NFKC for the metadata check; already in the build through pdfz-crypt (stringprep).
unicode-normalization = "0.1"
# Reads the PDF/A and PDF/UA identification by namespace; already in the build through pdfz-xfa.
roxmltree = "0.21"
sha2 = "0.11"

[dev-dependencies]
pdfz-testkit = { workspace = true }
# The redacted page is rendered in `tests::a_page_whose_pruned_pattern_is_still_selected_renders`:
# layer 3 from layer 4, a dev dependency only.
pdfz-render = { workspace = true }
