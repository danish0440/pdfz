[package]
name = "pdfz-engine"
description = "PdfZ engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfz-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
pdfz-render = { workspace = true }
pdfz-cos = { workspace = true }
pdfz-organize = { workspace = true }
pdfz-annot = { workspace = true }
pdfz-forms = { workspace = true }
pdfz-xfa = { workspace = true }
pdfz-edit = { workspace = true }
pdfz-audit = { workspace = true }
pdfz-redact = { workspace = true }
pdfz-print = { workspace = true }
pdfz-xfdf = { workspace = true }
pdfz-sign = { workspace = true }
pdfz-optimize = { workspace = true }
pdfz-a11y = { workspace = true }
pdfz-ocr = { workspace = true }
pdfz-js = { workspace = true }
pdfz-compare = { workspace = true }
pdfz-preflight = { workspace = true }
pdfz-export = { workspace = true }
pdfz-fonts = { workspace = true }
pdfz-create = { workspace = true }
pdfz-model = { workspace = true }
pdfz-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
