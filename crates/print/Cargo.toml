[package]
name = "pdfz-print"
description = "Printing: page selection, sizing (fit, actual, shrink, custom), multiple pages per sheet, booklets, posters, comments & forms; print-ready PDF and the system spooler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-cms = { workspace = true }
craft-print = { workspace = true }
log = { workspace = true }
pdfz-cos = { workspace = true }
pdfz-content = { workspace = true }
pdfz-model = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
winprint = { version = "0.2.1", git = "https://github.com/storytold/winprint.rs", rev = "5f80b9baf6b58937c401656634e42d33f00ddf49", default-features = false }

[dev-dependencies]
pdfz-render = { workspace = true }
# Reads the renamed programs back with a parser that isn't ours.
skrifa = "0.44"
