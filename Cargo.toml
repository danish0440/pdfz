[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/pdfz", "apps/pdfz-cli", "xtask"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/danish0440/pdfz"

[workspace.dependencies]
# Shared frontend components; engines remain independent of egui.
craft-ui = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
# Quit the macOS way (#1136): ⌘Q asks about unsaved changes, and closing quits through `terminate:`.
craft-quit = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "f58bc1a3df490992d633393d0898af0588ce882c" }
# Shared system spooler; document composition remains in pdfz-print.
craft-print = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "666c358065261a2816b376fa3bb10538dbf53040" }
# Whether a path stored in a document may be opened (GoToR link targets).
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
# internal
pdfz-geom = { path = "crates/geom", version = "0.9.0" }
pdfz-filters = { path = "crates/filters", version = "0.9.0" }
pdfz-cos = { path = "crates/cos", version = "0.9.0" }
pdfz-crypt = { path = "crates/crypt", version = "0.9.0" }
pdfz-organize = { path = "crates/organize", version = "0.9.0" }
pdfz-measure = { path = "crates/measure", version = "0.9.0" }
pdfz-annot = { path = "crates/annot", version = "0.9.0" }
pdfz-audit = { path = "crates/audit", version = "0.9.0" }
pdfz-fonts = { path = "crates/fonts", version = "0.9.0" }
pdfz-model = { path = "crates/model", version = "0.9.0" }
pdfz-content = { path = "crates/content", version = "0.9.0" }
pdfz-redact = { path = "crates/redact", version = "0.9.0" }
pdfz-print = { path = "crates/print", version = "0.9.0" }
pdfz-xfdf = { path = "crates/xfdf", version = "0.9.0" }
pdfz-sign = { path = "crates/sign", version = "0.9.0" }
pdfz-optimize = { path = "crates/optimize", version = "0.9.0" }
pdfz-a11y = { path = "crates/a11y", version = "0.9.0" }
pdfz-oracle = { path = "crates/oracle", version = "0.9.0" }
pdfz-testkit = { path = "crates/testkit", version = "0.9.0" }
pdfz-ocr = { path = "crates/ocr", version = "0.9.0" }
pdfz-js = { path = "crates/js", version = "0.9.0" }
pdfz-compare = { path = "crates/compare", version = "0.9.0" }
pdfz-preflight = { path = "crates/preflight", version = "0.9.0" }
pdfz-export = { path = "crates/export", version = "0.9.0" }
pdfz-edit = { path = "crates/edit", version = "0.9.0" }
pdfz-create = { path = "crates/create", version = "0.9.0" }
pdfz-forms = { path = "crates/forms", version = "0.9.0" }
pdfz-xfa = { path = "crates/xfa", version = "0.9.0" }
pdfz-render = { path = "crates/render", version = "0.9.0" }
pdfz-engine = { path = "crates/engine", version = "0.9.0" }
pdfz-platform = { path = "crates/platform", version = "0.9.0" }
pdfz-ui-egui = { path = "crates/ui-egui", version = "0.9.0" }
pdfz-automation = { path = "crates/automation", version = "0.9.0", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"

# testing
proptest = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.low-disk]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
winit = { path = "vendor/winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
vello_common = { path = "vendor/vello_common" }
