[package]
name = "pdfz-cli"
description = "PdfZ command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pdfz-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pdfz-render = { workspace = true }
serde_json = { workspace = true }
pdfz-engine = { workspace = true }
pdfz-audit = { workspace = true }
pdfz-cos = { workspace = true }
pdfz-preflight = { workspace = true }
pdfz-automation = { workspace = true }
pdfz-platform = { workspace = true }
base64 = "0.22"

[dev-dependencies]
# Decodes `render` output in tests/owner_password.rs; already a dependency of the engine.
png = "0.18"

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for pdfz-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`pdfz-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["pdfz-automation/mcp"]
